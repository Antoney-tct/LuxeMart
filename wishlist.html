<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Wishlist - LuxeMart</title><link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="css/main.css"><style>:root{--secondary:#ff6b35;--nav-h:68px;}.page-wrap{margin-top:var(--nav-h);padding:2.5rem 0 5rem;}.container{width:100%;max-width:1200px;margin:0 auto;padding:0 1.25rem;}.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}.page-title{font-family:"Playfair Display",serif;font-size:clamp(1.75rem,3vw,2.25rem);}.add-all{display:inline-flex;align-items:center;gap:.4rem;padding:.75rem 1.5rem;background:var(--secondary);color:white;border:none;border-radius:50px;font-weight:700;font-size:.875rem;cursor:pointer;transition:all .2s;}.add-all:hover{background:#e55a2b;}.empty{text-align:center;padding:5rem 2rem;}.empty i{font-size:5rem;color:var(--border,#e5e7eb);display:block;margin-bottom:1.5rem;}.empty h3{font-family:"Playfair Display",serif;margin-bottom:.5rem;}.empty p{color:var(--muted,#6b7280);font-size:.875rem;margin-bottom:1.5rem;}.empty a{display:inline-flex;align-items:center;gap:.4rem;padding:.75rem 1.5rem;background:var(--secondary);color:white;border-radius:50px;font-weight:700;text-decoration:none;}@media(max-width:768px){.nav-desktop{display:none!important;}.mobile-menu-toggle{display:block!important;}}</style></head><body><header><div class="container" style="max-width:1400px;"><div class="header-inner"><a href="index.html" class="logo"><img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" alt="LuxeMart"><span>LuxeMart</span></a><nav class="nav-desktop"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="categories.html">Categories</a><a href="sale.html">Sale</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><button class="icon-btn" id="searchBtn"><i class="fas fa-search"></i></button><a href="wishlist.html" class="icon-btn"><i class="fas fa-heart"></i><span class="cart-count" id="wishlistCount">0</span></a><button class="icon-btn" id="cartBtn"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span></button><div class="account-dropdown"><button class="icon-btn"><i class="fas fa-user"></i></button><div class="account-dropdown-menu"><a href="#" id="accountLink">My Account</a><a href="orders.html">My Orders</a><a href="seller-register.html">Sell on LuxeMart</a><a href="admin.html">Admin Dashboard</a><a href="#" id="logoutLink">Logout</a></div></div><button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button><button class="mobile-menu-toggle" style="display:none;"><i class="fas fa-bars"></i></button></div></div></div></header><div class="mobile-menu" id="mobileMenu"><button class="mobile-menu-close" id="closeMenu"><i class="fas fa-times"></i></button><ul><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li><li><a href="categories.html">Categories</a></li><li><a href="sale.html">Sale</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li></ul></div><div class="modal-overlay" id="searchModal"><div class="modal"><div class="modal-header"><h3 class="modal-title">Search</h3><button class="modal-close" id="closeSearch">x</button></div><div class="modal-body"><input type="text" id="searchInput" placeholder="Search products"><div id="searchSuggestions" class="search-suggestions"></div></div></div></div><div class="cart-sidebar" id="cartSidebar"><div class="cart-header"><h3 class="cart-title">Cart</h3><button class="modal-close" id="closeCart">x</button></div><div id="cartItems"></div><div class="cart-total">Total: <span id="cartTotal">KSh 0.00</span></div><div class="cart-actions"><a href="cart.html" class="btn-primary">View Cart</a></div></div><main class="page-wrap"><div class="container"><div class="page-header"><h1 class="page-title">My Wishlist</h1><button class="add-all" id="addAllBtn" style="display:none;"><i class="fas fa-shopping-bag"></i> Add All to Cart</button></div><div class="products-grid" id="wishlistGrid"></div></div></main><div id="toastContainer" class="toast-container"></div><script src="js/products.js"></script><script src="js/common.js"></script><script src="js/cart.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const grid=document.getElementById("wishlistGrid");const addAllBtn=document.getElementById("addAllBtn");const fmt=n=>`KSh ${Number(n).toLocaleString("en-KE")}`;const stars=r=>{let h="";for(let i=1;i<=5;i++)h+=i<=Math.floor(r)?"<i class='fas fa-star'></i>":i-.5<=r?"<i class='fas fa-star-half-alt'></i>":"<i class='far fa-star'></i>";return h;};function getIds(){return JSON.parse(localStorage.getItem("wishlist")||"[]");}function render(){const ids=getIds();const items=(window.products||[]).filter(p=>ids.includes(String(p.id)));if(!items.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1;"><i class="far fa-heart"></i><h3>Your wishlist is empty</h3><p>Browse and save items you love.</p><a href="shop.html"><i class="fas fa-shopping-bag"></i> Start Shopping</a></div>`;addAllBtn.style.display="none";return;}addAllBtn.style.display="inline-flex";grid.innerHTML=items.map(p=>`<div class="product-card"><div class="product-img-container" style="position:relative;height:220px;overflow:hidden;"><a href="product.html?id=${p.id}"><img src="${p.img||p.image_url}" alt="${p.name}" class="product-img" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=?'" style="width:100%;height:100%;object-fit:cover;"></a><div class="product-actions"><button class="product-action-btn remove-wish" data-id="${p.id}" title="Remove"><i class="fas fa-times"></i></button></div></div><div class="product-info"><div class="product-brand">${p.brand||""}</div><h4 class="product-title"><a href="product.html?id=${p.id}" style="color:inherit;">${p.name}</a></h4><div class="product-rating"><div class="stars">${stars(p.rating||4.5)}</div><span class="rating-count">(${p.reviews||0})</span></div><div class="product-price"><span class="price-current">${fmt(p.price)}</span>${p.originalPrice?`<span class="price-old">${fmt(p.originalPrice)}</span>`:""}</div><button class="add-to-cart" data-id="${p.id}" style="margin-top:.75rem;"><i class="fas fa-shopping-bag"></i> Add to Cart</button></div></div>`).join("");grid.querySelectorAll(".remove-wish").forEach(b=>{b.addEventListener("click",()=>{let ids=getIds();ids=ids.filter(x=>x!==b.dataset.id);localStorage.setItem("wishlist",JSON.stringify(ids));window.updateWishlistCount?.();render();window.showToast?.("Removed from wishlist.","info");});});}addAllBtn?.addEventListener("click",()=>{const ids=getIds();ids.forEach(id=>{const p=(window.products||[]).find(x=>String(x.id)===id);if(p)window.addToCart?.(p);});window.showToast?.(`${ids.length} items added to cart!`,"success");document.getElementById("cartSidebar")?.classList.add("open");});render();});</script></body></html>
