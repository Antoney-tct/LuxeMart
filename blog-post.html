<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — LuxeMart</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
    :root{--secondary:#ff6b35;--nav-h:68px;}
    .blog-wrap{margin-top:var(--nav-h);padding:3rem 0 5rem;}
    .container{width:100%;max-width:800px;margin:0 auto;padding:0 1.25rem;}
    .back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;color:var(--muted,#6b7280);margin-bottom:1.5rem;transition:color .2s;}
    .back-link:hover{color:var(--secondary);}
    .post-category{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--secondary);margin-bottom:.625rem;}
    .post-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.2;margin-bottom:1rem;}
    .post-meta{display:flex;align-items:center;gap:1rem;font-size:.82rem;color:var(--muted,#6b7280);margin-bottom:2rem;flex-wrap:wrap;}
    .post-meta span{display:flex;align-items:center;gap:.3rem;}
    .post-hero-img{width:100%;max-height:480px;object-fit:cover;border-radius:16px;margin-bottom:2.5rem;box-shadow:0 8px 30px rgba(0,0,0,0.12);}
    .post-body{font-size:1.05rem;line-height:1.85;color:var(--text,#1a1a1a);}
    .post-body p{margin-bottom:1.5rem;}
    .post-body h2,.post-body h3{font-family:'Playfair Display',serif;margin:2rem 0 1rem;}
    .post-body h2{font-size:1.6rem;}
    .post-body h3{font-size:1.25rem;}
    .post-body ul,.post-body ol{margin:0 0 1.5rem 1.5rem;}
    .post-body li{margin-bottom:.5rem;}
    .post-body blockquote{border-left:4px solid var(--secondary);padding:.875rem 1.25rem;margin:1.5rem 0;background:rgba(255,107,53,0.05);border-radius:0 8px 8px 0;font-style:italic;color:var(--muted,#6b7280);}
    .post-footer{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border,#e5e7eb);}
    .share-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
    .share-label{font-weight:700;font-size:.875rem;}
    .share-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:50px;font-size:.78rem;font-weight:700;transition:all .2s;cursor:pointer;border:none;}
    .share-twitter{background:#1da1f2;color:white;}
    .share-facebook{background:#1877f2;color:white;}
    .share-copy{background:var(--accent,#f8f7f4);color:var(--text,#1a1a1a);border:1px solid var(--border,#e5e7eb);}
    .share-btn:hover{opacity:.85;transform:translateY(-1px);}
    .related-posts{margin-top:4rem;}
    .related-posts h3{font-family:'Playfair Display',serif;font-size:1.35rem;margin-bottom:1.25rem;}
    .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem;}
    .related-card{background:var(--white,#fff);border:1px solid var(--border,#e5e7eb);border-radius:14px;overflow:hidden;transition:all .2s;}
    .related-card:hover{box-shadow:0 8px 24px rgba(0,0,0,0.1);transform:translateY(-3px);}
    .related-card img{width:100%;height:140px;object-fit:cover;}
    .related-card-info{padding:.875rem;}
    .related-card-cat{font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--secondary);margin-bottom:.25rem;}
    .related-card-title{font-weight:600;font-size:.875rem;line-height:1.4;}
    .skeleton{background:linear-gradient(90deg,var(--accent,#f8f7f4) 25%,var(--border,#e5e7eb) 50%,var(--accent,#f8f7f4) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
    @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
    @media(max-width:768px){.nav-desktop{display:none!important;}.mobile-menu-toggle{display:block!important;}}
    </style>
</head>
<body>
<header>
    <div class="container" style="max-width:1400px;">
        <div class="header-inner">
            <a href="index.html" class="logo"><img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" alt="LuxeMart"><span>LuxeMart</span></a>
            <nav class="nav-desktop">
                <a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-btn" id="searchBtn"><i class="fas fa-search"></i></button>
                <a href="wishlist.html" class="icon-btn"><i class="fas fa-heart"></i><span class="cart-count" id="wishlistCount">0</span></a>
                <button class="icon-btn" id="cartBtn"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span></button>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="mobile-menu-toggle" style="display:none;"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </div>
</header>
<div class="mobile-menu" id="mobileMenu">
    <button class="mobile-menu-close" id="closeMenu"><i class="fas fa-times"></i></button>
    <ul><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li><li><a href="contact.html">Contact</a></li></ul>
</div>
<div class="modal-overlay" id="searchModal">
    <div class="modal"><div class="modal-header"><h3 class="modal-title">Search</h3><button class="modal-close" id="closeSearch">×</button></div>
    <div class="modal-body"><input type="text" id="searchInput" placeholder="Search products…"><div id="searchSuggestions" class="search-suggestions"></div></div></div>
</div>
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header"><h3 class="cart-title">Cart</h3><button class="modal-close" id="closeCart">×</button></div>
    <div id="cartItems"></div>
    <div class="cart-total">Total: <span id="cartTotal">KSh 0.00</span></div>
    <div class="cart-actions"><a href="cart.html" class="btn-primary">View Cart</a></div>
</div>

<main class="blog-wrap">
    <div class="container" id="blogPostContainer">
        <div class="skeleton" style="height:16px;width:120px;margin-bottom:1.5rem;"></div>
        <div class="skeleton" style="height:12px;width:80px;margin-bottom:.625rem;"></div>
        <div class="skeleton" style="height:48px;margin-bottom:1rem;"></div>
        <div class="skeleton" style="height:12px;width:60%;margin-bottom:2rem;"></div>
        <div class="skeleton" style="height:400px;border-radius:16px;margin-bottom:2.5rem;"></div>
        <div class="skeleton" style="height:14px;margin-bottom:.75rem;"></div>
        <div class="skeleton" style="height:14px;margin-bottom:.75rem;"></div>
        <div class="skeleton" style="height:14px;width:80%;"></div>
    </div>
</main>

<div id="toastContainer" class="toast-container"></div>
<script src="js/blog-data.js"></script>
<script src="js/products.js"></script>
<script src="js/common.js"></script>
<script src="js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
    const container=document.getElementById('blogPostContainer');
    if(!container)return;
    const params=new URLSearchParams(window.location.search);
    const id=parseInt(params.get('id'),10);
    if(!id||typeof blogPosts==='undefined'){
        container.innerHTML='<h2>Post not found</h2><p><a href="index.html" style="color:var(--secondary);">Go home</a></p>';
        return;
    }
    const post=blogPosts.find(p=>p.id===id);
    if(!post){
        container.innerHTML='<h2>Post not found</h2><p><a href="index.html" style="color:var(--secondary);">Go home</a></p>';
        return;
    }
    document.title=`${post.title} — LuxeMart`;
    const shareUrl=encodeURIComponent(window.location.href);
    const shareText=encodeURIComponent(post.title);
    const related=(blogPosts||[]).filter(p=>p.id!==id).slice(0,3);
    container.innerHTML=`
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <div class="post-category">${post.category}</div>
        <h1 class="post-title">${post.title}</h1>
        <div class="post-meta">
            <span><i class="fas fa-calendar-alt"></i>${post.date}</span>
            <span><i class="fas fa-clock"></i>${post.readTime}</span>
        </div>
        <img src="${post.image}" alt="${post.title}" class="post-hero-img" onerror="this.style.display='none'">
        <div class="post-body">${post.content}</div>
        <div class="post-footer">
            <div class="share-row">
                <span class="share-label">Share this article:</span>
                <a href="https://twitter.com/intent/tweet?url=${shareUrl}&text=${shareText}" target="_blank" class="share-btn share-twitter"><i class="fab fa-twitter"></i> Tweet</a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="share-btn share-facebook"><i class="fab fa-facebook-f"></i> Share</a>
                <button class="share-btn share-copy" onclick="navigator.clipboard.writeText(window.location.href);window.showToast('Link copied!','success');"><i class="fas fa-link"></i> Copy Link</button>
            </div>
        </div>
        ${related.length?`
        <div class="related-posts">
            <h3>More from Our Blog</h3>
            <div class="related-grid">
                ${related.map(r=>`
                    <a href="blog-post.html?id=${r.id}" class="related-card" style="text-decoration:none;color:inherit;">
                        <img src="${r.image}" alt="${r.title}" onerror="this.style.display='none'">
                        <div class="related-card-info">
                            <div class="related-card-cat">${r.category}</div>
                            <div class="related-card-title">${r.title}</div>
                        </div>
                    </a>`).join('')}
            </div>
        </div>`:''}
    `;
});
</script>
</body>
</html>
